<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8"> <title>CosmoSim</title>
  <style>
    /* Dark space theme and basic centering for the app */
    body {
      margin: 0;
      background: #050A12;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* The main simulation window */
    canvas {
      border: 1px solid #0A7E8C;
      margin-top: 10px;
    }

    /* The FPS and particle counter text */
    #stats {
      color: #7FDBFF;
      font: 13px monospace;
      margin-top: 8px;
    }

    button {
      background: #0A7E8C;
      color: white;
      border: none;
      padding: 8px 18px;
      margin: 4px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <canvas id="canvas" width="900" height="700"></canvas>

  <div id="stats">Loading WASM...</div>

  <div style="margin-top:8px;">
    <button onclick="Module._initUniformDust()">Uniform Dust</button>
    <button onclick="Module._initGalaxyCollision()">Galaxy Collision</button>
    <button onclick="Module._initBinaryStar()">Binary Star</button>
    <span style="color:#7FDBFF; font:13px monospace; margin-left:16px;">
      θ: <input type="range" min="0.2" max="1.2" step="0.1" value="0.5"
          style="vertical-align:middle;"
          oninput="Module._setTheta(parseFloat(this.value)); document.getElementById('tval').textContent=parseFloat(this.value).toFixed(1)">
      <span id="tval">0.5</span>
      &nbsp;(0.3=accurate · 0.8=fast)
    </span>
  </div>

  <script src="main.js"></script>
  <script src="cosmosim.js"></script>
</body>

</html>
